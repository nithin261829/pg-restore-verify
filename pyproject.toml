[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-restore-verify"
version = "0.1.0"
description = "PostgreSQL backups that are proven restorable: snapshot-consistent dumps, automated restore tests, and Prometheus metrics."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
pgrv = "pgrv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["build"]
